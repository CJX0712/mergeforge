[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeforge"
version = "0.1.0"
description = "MergeForge: world-class model merging / task-arithmetic system (pure NumPy, deterministic, CPU-only). Author: 晨星"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = ["model-merging", "task-arithmetic", "ties-merging", "model-soups", "multi-task", "numpy"]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.setuptools.packages.find]
include = ["core*", "data*", "models*", "finetune*", "merging*", "eval*", "pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PLE", "PLW"]
# RUF001/002/003: 中文排版的全角标点（（）：，、）属正常排版，非同形字漏洞
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
